name: Apply Media Finder launcher position patch

on:
  push:
    paths:
      - '.github/workflows/media-finder-launcher-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: echo '' | base64 -d | git apply --whitespace=nowarn -
      - name: Validate
        run: node --check 'media finder.user.js'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'media finder.user.js' 'media finder.meta.js'
          git commit -m 'feat: customize Media Finder toggle position'
          git push origin HEAD:main
