name: Rework Media Finder midnight UI

on:
  push:
    paths:
      - '.github/workflows/media-finder-midnight-rework.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI rework
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate userscript
        run: |
          node --check 'media finder.user.js'
          node --check 'media finder.meta.js'
      - name: Commit UI rework
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/media-finder-midnight-rework.yml'
          git add 'media finder.user.js' 'media finder.meta.js'
          git commit -m 'feat: rework Media Finder midnight UI'
          git push origin HEAD:main